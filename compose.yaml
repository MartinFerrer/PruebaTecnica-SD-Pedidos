name: roshka-local
services:
  order-db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
    volumes: [order-data:/var/lib/postgresql]
    networks: [order-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 3s
      timeout: 3s
      retries: 30
  inventory-db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD in .env}
    volumes: [inventory-data:/var/lib/postgresql]
    networks: [inventory-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 3s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.2.3-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-limits.conf:ro
    networks: [messaging]
    ports: ["127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  order-service:
    image: roshka/order-service:local
    build:
      context: .
      args: {SERVICE: order}
    environment:
      DATABASE_URL: jdbc:postgresql://order-db:5432/orders
      DATABASE_USER: orders
      DATABASE_PASSWORD: ${ORDER_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports: ["127.0.0.1:${ORDER_PORT:-8081}:8080"]
    networks: [order-data, messaging]
    depends_on:
      order-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  inventory-service:
    image: roshka/inventory-service:local
    build:
      context: .
      args: {SERVICE: inventory}
    environment:
      DATABASE_URL: jdbc:postgresql://inventory-db:5432/inventory
      DATABASE_USER: inventory
      DATABASE_PASSWORD: ${INVENTORY_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports: ["127.0.0.1:${INVENTORY_PORT:-8082}:8080"]
    networks: [inventory-data, messaging]
    depends_on:
      inventory-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  demo-data:
    profiles: [demo-data]
    image: roshka/demo-data:local
    build:
      context: ./deploy/demo-data
    environment:
      INVENTORY_URL: http://inventory-service:8080
      ORDER_URL: http://order-service:8080
      DEMO_TIMEOUT_SECONDS: 45
    networks: [messaging]
    depends_on:
      order-service: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
    restart: "no"
  dlq-replay:
    profiles: [operations]
    image: roshka/order-service:local
    entrypoint: [java, -Dloader.main=com.roshka.platform.messaging.DlqReplayCommand, -cp, /app/app.jar, org.springframework.boot.loader.launch.PropertiesLauncher]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    networks: [messaging]
    restart: "no"
  acceptance:
    profiles: [acceptance]
    image: usebruno/cli:4.1.0
    working_dir: /bruno
    volumes:
      - ./tests/bruno:/bruno:ro
      - ./reports:/reports
    networks: [messaging]
    command: [run, --env, compose, --sandbox, developer, --reporter-junit, /reports/bruno.xml]
    depends_on:
      order-service: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
    restart: "no"
networks:
  order-data: {internal: true}
  inventory-data: {internal: true}
  messaging: {}
volumes:
  order-data: {}
  inventory-data: {}
  rabbit-data: {}
