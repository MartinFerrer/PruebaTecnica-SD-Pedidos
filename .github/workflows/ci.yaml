name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-gate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      ORDER_DB_PASSWORD: ci-order-${{ github.run_id }}
      INVENTORY_DB_PASSWORD: ci-inventory-${{ github.run_id }}
      RABBITMQ_PASSWORD: ci-rabbit-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Test and quality gates
        run: java scripts/Verify.java full
      - name: Acceptance and demo replay
        run: java scripts/Verify.java acceptance
      - name: Concurrency and replica smoke
        run: java scripts/Verify.java concurrency --seed ci-${{ github.run_id }}
      - name: Constrained resource smoke
        run: java scripts/Verify.java constrained --seed ci-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-reports-${{ matrix.os }}
          path: |
            reports/verification/
            services/*/target/surefire-reports/
            services/*/target/failsafe-reports/
            services/*/target/site/jacoco/
