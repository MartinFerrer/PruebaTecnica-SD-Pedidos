name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Ephemeral test credentials
        run: |
          echo "ORDER_DB_PASSWORD=ci-order-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "INVENTORY_DB_PASSWORD=ci-inventory-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "RABBITMQ_PASSWORD=ci-rabbit-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Test and quality gates
        run: mvn -B -ntp clean verify
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start local deployment
        run: docker compose up --build --wait --wait-timeout 180
      - name: Seed demo data twice and verify idempotency
        run: |
          docker compose --profile demo-data run --build --rm demo-data
          docker compose --profile demo-data run --rm demo-data
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/compose.log
          docker compose ps -a > reports/compose-status.txt
      - name: Stop CI deployment, preserve reports
        if: always()
        run: docker compose down
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-reports
          path: |
            services/*/target/surefire-reports/
            services/*/target/failsafe-reports/
            services/*/target/site/jacoco/
            reports/
