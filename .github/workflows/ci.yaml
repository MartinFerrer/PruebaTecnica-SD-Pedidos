name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ORDER_DB_PASSWORD: ci-order-${{ github.run_id }}
  INVENTORY_DB_PASSWORD: ci-inventory-${{ github.run_id }}
  RABBITMQ_PASSWORD: ci-rabbit-${{ github.run_id }}

jobs:
  static_checks:
    name: static-checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Contracts and Checkstyle warnings
        run: java scripts/Verify.java static
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: static-checks-${{ matrix.os }}-${{ github.run_id }}
          path: reports/verification/
          if-no-files-found: warn
          retention-days: 7

  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Unit and architecture tests
        run: java scripts/Verify.java quick
      - name: Property tests
        run: java scripts/Verify.java property --seed ci-${{ github.run_id }}
      - name: Reproducible fuzz smoke
        run: java scripts/Verify.java fuzz --seed ci-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unit-${{ matrix.os }}-${{ github.run_id }}
          path: reports/verification/
          if-no-files-found: warn
          retention-days: 7

  integration:
    name: integration
    needs: [static_checks, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Integration tests and coverage
        run: java scripts/Verify.java full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-${{ github.run_id }}
          path: |
            reports/verification/
            services/*/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

  container:
    name: container
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Validate Compose and build images
        run: java scripts/Verify.java container
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: container-${{ github.run_id }}
          path: reports/verification/
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: e2e
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Compose, Bruno and idempotent demo replay
        run: java scripts/Verify.java acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e2e-${{ github.run_id }}
          path: reports/verification/
          if-no-files-found: warn
          retention-days: 7

  concurrency_smoke:
    name: concurrency-smoke
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Deterministic races and replica smoke
        run: java scripts/Verify.java concurrency --seed ci-${{ github.run_id }}
      - name: Constrained resource smoke
        run: java scripts/Verify.java constrained --seed ci-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: concurrency-smoke-${{ github.run_id }}
          path: reports/verification/
          if-no-files-found: warn
          retention-days: 7

  observability_smoke:
    name: observability-smoke
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Observability profile smoke
        run: java scripts/Verify.java observability --seed ci-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: observability-smoke-${{ github.run_id }}
          path: reports/verification/
          if-no-files-found: warn
          retention-days: 7

  quality-gate:
    name: quality-gate
    if: always()
    needs: [static_checks, unit, integration, container, e2e, concurrency_smoke, observability_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate to succeed
        env:
          STATIC_CHECKS: ${{ needs.static_checks.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          CONTAINER: ${{ needs.container.result }}
          E2E: ${{ needs.e2e.result }}
          CONCURRENCY_SMOKE: ${{ needs.concurrency_smoke.result }}
          OBSERVABILITY_SMOKE: ${{ needs.observability_smoke.result }}
        run: |
          for result in "$STATIC_CHECKS" "$UNIT" "$INTEGRATION" "$CONTAINER" "$E2E" "$CONCURRENCY_SMOKE" "$OBSERVABILITY_SMOKE"; do
            test "$result" = "success"
          done
