name: Extended verification

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read

concurrency:
  group: extended-verification
  cancel-in-progress: false

jobs:
  campaign:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fuzzing-reproducible
            suite: fuzz
            fuzz-inputs: 20000
          - name: resource-pressure
            suite: constrained
            fuzz-inputs: 512
          - name: network-chaos
            suite: chaos
            fuzz-inputs: 512
          - name: messaging-resilience
            suite: concurrency
            fuzz-inputs: 512
    env:
      ORDER_DB_PASSWORD: extended-order-${{ github.run_id }}
      INVENTORY_DB_PASSWORD: extended-inventory-${{ github.run_id }}
      RABBITMQ_PASSWORD: extended-rabbit-${{ github.run_id }}
      FUZZ_INPUTS: ${{ matrix.fuzz-inputs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Run ${{ matrix.name }}
        run: java scripts/Verify.java ${{ matrix.suite }} --seed extended-${{ github.run_id }}-${{ matrix.name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.name }}-${{ github.run_id }}
          path: reports/verification/
          if-no-files-found: warn
          retention-days: 7
