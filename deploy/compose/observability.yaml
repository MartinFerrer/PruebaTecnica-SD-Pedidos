services:
  otel-agent-init:
    profiles: [observability]
    image: curlimages/curl:8.11.1
    volumes:
      - otel-javaagent:/agent
    entrypoint: [sh, -c]
    command:
      - >-
        curl -fsSL --retry 3
        -o /agent/opentelemetry-javaagent.jar
        https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.10.0/opentelemetry-javaagent.jar
    user: root
    restart: "no"

  order-service:
    profiles: [observability]
    environment:
      SPRING_PROFILES_ACTIVE: observability
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError -javaagent:/otel/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: order-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: otlp
      OTEL_INSTRUMENTATION_RABBITMQ_ENABLED: "false"
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=roshka,deployment.environment=local
    volumes:
      - otel-javaagent:/otel:ro
    ports: !override ["127.0.0.1:18081:8080"]
    depends_on:
      otel-agent-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_healthy}

  inventory-service:
    profiles: [observability]
    environment:
      SPRING_PROFILES_ACTIVE: observability
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError -javaagent:/otel/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: inventory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: otlp
      OTEL_INSTRUMENTATION_RABBITMQ_ENABLED: "false"
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=roshka,deployment.environment=local
    volumes:
      - otel-javaagent:/otel:ro
    ports: !override ["127.0.0.1:18082:8080"]
    depends_on:
      otel-agent-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_healthy}

  rabbitmq:
    profiles: [observability]
    command: [sh, -c, rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server]
    ports: !override ["127.0.0.1:15672:15672", "127.0.0.1:15692:15692"]

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [messaging]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    healthcheck:
      test: [CMD, /otelcol-contrib, --version]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.1.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=6h]
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks: [messaging]
    ports: ["127.0.0.1:19090:9090"]
    depends_on:
      order-service: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.7.2
    command: [-config.file=/etc/tempo/tempo.yaml]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [messaging]
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:3200/ready]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

  loki:
    profiles: [observability]
    image: grafana/loki:3.3.2
    command: [-config.file=/etc/loki/loki.yaml]
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [messaging]
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:3100/ready]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_MODE: console
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [messaging]
    ports: ["127.0.0.1:13000:3000"]
    depends_on:
      prometheus: {condition: service_healthy}
      tempo: {condition: service_healthy}
      loki: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:3000/api/health]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

volumes:
  otel-javaagent: {}
  prometheus-data: {}
  tempo-data: {}
  loki-data: {}
  grafana-data: {}
