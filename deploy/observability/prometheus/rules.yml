groups:
  - name: roshka-observability
    rules:
      - alert: RoshkaDlqMessages
        expr: rabbitmq_queue_messages{queue=~".*\\.dlq"} > 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "RabbitMQ DLQ contiene mensajes"}
      - alert: RoshkaReadinessFailed
        expr: up{job=~"order-service|inventory-service"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Un servicio no responde a Prometheus"}
      - alert: RoshkaOutboxBacklog
        expr: outbox_pending > 20
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Outbox pendiente por encima del umbral"}
